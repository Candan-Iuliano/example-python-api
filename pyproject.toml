[project]
name = "geospatial-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Candan Iuliano", email = "ciuliano88@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
geospatial-api = "geospatial_api:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
